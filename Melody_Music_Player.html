<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melody — Music Player</title>
<style>
:root{--bg:#0c0d18;--panel:#17192a;--muted:#a5a8c4;--text:#f7f7ff;--accent:#b49aff;--accent2:#ff8fc7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 10%,#342653 0,transparent 35%),radial-gradient(circle at 90% 85%,#4b234b 0,transparent 32%),var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.app{width:min(100%,980px);display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:rgba(23,25,42,.88);border:1px solid rgba(255,255,255,.09);border-radius:26px;box-shadow:0 24px 70px #0005;backdrop-filter:blur(18px)}
.player{padding:28px;display:flex;flex-direction:column;align-items:center}.top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:800;letter-spacing:1px}.brand span{color:var(--accent)}.pill{font-size:12px;color:#d9d3ff;background:#29233f;padding:8px 12px;border-radius:30px}
.cover-wrap{width:min(100%,300px);aspect-ratio:1;border-radius:24px;padding:10px;background:linear-gradient(135deg,#a48bff,#ff9aca,#f9cf8a);box-shadow:0 18px 50px #a48bff30;margin:4px 0 25px}.cover{width:100%;height:100%;border-radius:17px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 35% 30%,#ffd9ef,transparent 24%),linear-gradient(145deg,#38275f,#a44d8a 60%,#ffb6a0);position:relative}.cover:before,.cover:after{content:"";position:absolute;border:1px solid #ffffff45;border-radius:50%;width:78%;aspect-ratio:1}.cover:after{width:58%}.disc{width:35%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#1d1930 0 4px,#3e3157 5px 7px);border:7px solid #252039;display:grid;place-items:center;z-index:1;box-shadow:0 10px 25px #0006}.disc:after{content:"";width:25%;aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,#ffc0df,#a18cff);border:3px solid #fff8}
.song-info{text-align:center}.song-info h1{font-size:25px;margin:0 0 8px}.song-info p{color:var(--muted);margin:0;font-size:14px}.heart{border:0;background:transparent;color:#aeb0ca;font-size:24px;cursor:pointer;margin-top:12px}.heart.active{color:#ff8fc7}
.progress-area{width:100%;margin:22px 0 15px}.time-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}.controls{display:flex;align-items:center;justify-content:center;gap:24px;margin:13px 0 21px}.icon-btn{border:0;background:transparent;color:#e9e7ff;font-size:23px;cursor:pointer;transition:transform .15s,color .15s}.icon-btn:hover{transform:scale(1.12);color:var(--accent)}.play-btn{width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1b1428;font-size:24px;cursor:pointer;box-shadow:0 8px 25px #b49aff40}.bottom-controls{width:100%;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.volume{display:flex;align-items:center;gap:9px;width:45%}.volume input{max-width:120px}.toggle{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}.toggle.active{color:var(--accent)}
.playlist-card{padding:26px;min-width:0}.playlist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.playlist-head h2{margin:0;font-size:21px}.playlist-head span{font-size:12px;color:var(--muted)}.search{width:100%;border:1px solid #ffffff15;background:#101220;color:var(--text);padding:13px 15px;border-radius:13px;outline:none;margin-bottom:17px}.search:focus{border-color:var(--accent)}.track-list{display:flex;flex-direction:column;gap:8px;max-height:470px;overflow:auto;padding-right:4px}.track{display:flex;align-items:center;gap:13px;padding:12px;border-radius:15px;border:1px solid transparent;cursor:pointer;transition:.2s}.track:hover{background:#ffffff08}.track.active{background:#b49aff16;border-color:#b49aff45}.track-art{width:47px;height:47px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,#594f9a,#df83b2)}.track:nth-child(2) .track-art{background:linear-gradient(135deg,#d78a83,#f4cb93)}.track:nth-child(3) .track-art{background:linear-gradient(135deg,#4a9c9a,#8ad4c1)}.track:nth-child(4) .track-art{background:linear-gradient(135deg,#6252ad,#9eb9ff)}.track:nth-child(5) .track-art{background:linear-gradient(135deg,#b65d93,#f2a8c8)}.track-details{flex:1;min-width:0}.track-details strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-details small{display:block;color:var(--muted);font-size:12px;margin-top:5px}.track-time{font-size:12px;color:var(--muted)}.footer-note{font-size:11px;color:#8588a7;line-height:1.5;margin-top:18px}
@media(max-width:720px){body{padding:14px}.app{grid-template-columns:1fr;max-width:480px;gap:15px}.player{padding:22px}.cover-wrap{width:220px}.playlist-card{padding:22px}.track-list{max-height:330px}.song-info h1{font-size:23px}}
</style>
</head>
<body>
<main class="app">
<section class="card player">
  <div class="top"><div class="brand">♫ <span>MELODY</span></div><div class="pill">YOUR MUSIC SPACE</div></div>
  <div class="cover-wrap"><div class="cover"><div class="disc"></div></div></div>
  <div class="song-info"><h1 id="title">Midnight Dreams</h1><p id="artist">Luna Waves</p><button class="heart" id="favorite" aria-label="Add to favorites">♡</button></div>
  <div class="progress-area"><div class="time-row"><span id="current">0:00</span><span id="duration">0:00</span></div><input id="seek" type="range" min="0" max="100" value="0" aria-label="Song progress"></div>
  <div class="controls"><button class="icon-btn" id="shuffle" title="Shuffle">⤨</button><button class="icon-btn" id="prev" title="Previous">|◀</button><button class="play-btn" id="play" title="Play">▶</button><button class="icon-btn" id="next" title="Next">▶|</button><button class="icon-btn" id="repeat" title="Repeat">↻</button></div>
  <div class="bottom-controls"><div class="volume">🔊 <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"></div><span id="status">Ready to play</span></div>
  <audio id="audio" preload="metadata"></audio>
</section>
<section class="card playlist-card">
  <div class="playlist-head"><h2>Playlist</h2><span id="track-count">5 TRACKS</span></div>
  <input class="search" id="search" type="search" placeholder="⌕  Search songs or artists..." aria-label="Search playlist">
  <div class="track-list" id="track-list"></div>
  <div class="footer-note">Choose a track to play. Audio requires an internet connection for these demo tracks. If a track does not load, try another song.</div>
</section>
</main>
<script>
const tracks = [
 {title:"Midnight Dreams",artist:"Luna Waves",album:"After Hours",emoji:"☾",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},
 {title:"Golden Hour",artist:"The Daylights",album:"Soft Focus",emoji:"☀",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"},
 {title:"Ocean Eyes",artist:"Blue Avenue",album:"Tides",emoji:"🌊",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},
 {title:"Neon Skies",artist:"Nova June",album:"City Lights",emoji:"✦",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"},
 {title:"Slow Motion",artist:"Mira Sol",album:"Little Moments",emoji:"♡",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"}
];
const audio=document.getElementById('audio'), title=document.getElementById('title'), artist=document.getElementById('artist'), playBtn=document.getElementById('play'), seek=document.getElementById('seek'), current=document.getElementById('current'), duration=document.getElementById('duration'), status=document.getElementById('status'), list=document.getElementById('track-list');
let index=0, isPlaying=false, repeat=false, shuffle=false, favorites=new Set();
function time(s){if(!Number.isFinite(s))return '0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function renderList(filter=''){list.innerHTML='';let found=0;tracks.forEach((t,i)=>{if(!(t.title+' '+t.artist+' '+t.album).toLowerCase().includes(filter.toLowerCase()))return;found++;let row=document.createElement('div');row.className='track'+(i===index?' active':'');row.innerHTML=`<div class="track-art">${t.emoji}</div><div class="track-details"><strong>${t.title}</strong><small>${t.artist} · ${t.album}</small></div><span class="track-time">${i===index&&isPlaying?'♫':'♪'}</span>`;row.addEventListener('click',()=>loadTrack(i,true));list.appendChild(row)});if(!found)list.innerHTML='<p style="color:#a5a8c4;text-align:center;padding:25px">No songs found.</p>';document.getElementById('track-count').textContent=tracks.length+' TRACKS'}
function loadTrack(i,autoplay=false){index=(i+tracks.length)%tracks.length;let t=tracks[index];audio.src=t.src;title.textContent=t.title;artist.textContent=t.artist;seek.value=0;current.textContent='0:00';duration.textContent='0:00';document.getElementById('favorite').textContent=favorites.has(index)?'♥':'♡';document.getElementById('favorite').classList.toggle('active',favorites.has(index));renderList(document.getElementById('search').value);status.textContent='Ready to play';if(autoplay)playSong()}
function playSong(){audio.play().then(()=>{isPlaying=true;playBtn.textContent='Ⅱ';status.textContent='Now playing';renderList(document.getElementById('search').value)}).catch(()=>{status.textContent='Tap play again to load audio';isPlaying=false;playBtn.textContent='▶'})}
function pauseSong(){audio.pause();isPlaying=false;playBtn.textContent='▶';status.textContent='Paused';renderList(document.getElementById('search').value)}
playBtn.addEventListener('click',()=>isPlaying?pauseSong():playSong());
document.getElementById('prev').addEventListener('click',()=>loadTrack(index-1,true));
document.getElementById('next').addEventListener('click',nextTrack);
function nextTrack(){if(shuffle){let n=index;while(tracks.length>1&&n===index)n=Math.floor(Math.random()*tracks.length);loadTrack(n,true)}else loadTrack(index+1,true)}
document.getElementById('repeat').addEventListener('click',e=>{repeat=!repeat;e.currentTarget.classList.toggle('active',repeat);status.textContent=repeat?'Repeat one on':'Repeat off'});
document.getElementById('shuffle').addEventListener('click',e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('active',shuffle);status.textContent=shuffle?'Shuffle on':'Shuffle off'});
document.getElementById('favorite').addEventListener('click',()=>{if(favorites.has(index))favorites.delete(index);else favorites.add(index);document.getElementById('favorite').textContent=favorites.has(index)?'♥':'♡';document.getElementById('favorite').classList.toggle('active',favorites.has(index))});
audio.addEventListener('loadedmetadata',()=>duration.textContent=time(audio.duration));
audio.addEventListener('timeupdate',()=>{if(Number.isFinite(audio.duration)&&audio.duration>0){seek.value=audio.currentTime/audio.duration*100;current.textContent=time(audio.currentTime);duration.textContent=time(audio.duration)}});
seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration))audio.currentTime=seek.value/100*audio.duration});
document.getElementById('volume').addEventListener('input',e=>audio.volume=Number(e.target.value));
audio.volume=.7;audio.addEventListener('ended',()=>{if(repeat){audio.currentTime=0;playSong()}else if(index<tracks.length-1||shuffle)nextTrack();else{pauseSong();audio.currentTime=0}});
audio.addEventListener('error',()=>{status.textContent='Audio unavailable — try another track'});
document.getElementById('search').addEventListener('input',e=>renderList(e.target.value));
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();isPlaying?pauseSong():playSong()}if(e.code==='ArrowRight')nextTrack();if(e.code==='ArrowLeft')loadTrack(index-1,true)});
loadTrack(0,false);
</script>
</body>
</html>
